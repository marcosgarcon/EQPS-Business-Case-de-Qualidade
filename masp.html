<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EPQS SYSTEM - Gerenciador MASP</title>
<script src="https://unpkg.com/@phosphor-icons/web"></script>
<style>
  :root{--bg:#0a1628;--panel:#0f1e36;--muted:#1a2942;--card:#0d1a2e;--text:#e5e7eb;--accent:#ff7a1a;--accent2:#ffa552;--ok:#22c55e;--warn:#f59e0b;--bad:#ef4444;--shadow:0 10px 30px rgba(0,0,0,.45);--radius:16px;}
  *{box-sizing:border-box}html,body{height:100%}
  body{margin:0;font-family:system-ui,Inter,Arial;background:linear-gradient(120deg,#081225,#0a1a35);color:var(--text);display:grid;grid-template-columns:280px 1fr;grid-template-rows:auto 1fr;}
  header{grid-column:1/3;display:flex;align-items:center;justify-content:space-between;padding:14px 20px;background:linear-gradient(90deg,#081225,#0a1f3d);border-bottom:1px solid #1e2f4d;position:sticky;top:0;z-index:5}
  .header-title h1{margin:0;font-size:20px;}.header-title .subtitle{margin:4px 0 0 0;font-size:14px;color:var(--accent);}.header-title .dev-credit{margin:4px 0 0 0;font-size:11px;color:#64748b;}
  button,.btn{background:var(--muted);color:var(--text);border:1px solid #2a3a55;border-radius:12px;padding:10px 14px;cursor:pointer;box-shadow:var(--shadow);transition:.2s;font-weight:600}
  button:hover,.btn:hover{transform:translateY(-1px);border-color:#3d4f6f}
  button.primary,.btn.primary{background:linear-gradient(180deg,#ff7a1a,#e85d04);border-color:transparent;color:#fff}
  button.ghost,.btn.ghost{background:transparent;border-color:#3d4f6f}
  aside{border-right:1px solid #1e2f4d;background:linear-gradient(180deg,#081225,#0a1a35);padding:16px;display:flex;flex-direction:column;gap:24px;justify-content:space-between;}
  .menu a{display:flex;gap:10px;align-items:center;color:#cbd5e1;padding:10px 12px;border:1px solid #1e2f4d;border-radius:12px;background:rgba(255,255,255,.02);cursor:pointer;}
  .menu a.active,.menu a:hover{border-color:#ff7a1a;background:rgba(255,122,26,.1);color:#ffe0c2}
  main{padding:18px;overflow:auto}.hidden{display:none !important;}
  section{background:rgba(255,255,255,.03);border:1px solid #1e2f4d;border-radius:var(--radius);padding:16px;margin-bottom:18px;box-shadow:var(--shadow)}
  h2,h4{margin:0 0 12px 0;color:var(--accent);}h4{color:var(--accent2)}
  .grid{display:grid;grid-template-columns:repeat(12,1fr);gap:12px}
  .field{display:flex;flex-direction:column;gap:6px}
  label{font-size:12px;color:#ffa552}
  input,select,textarea{background:#0d1a2e;border:1px solid #2a3a55;color:var(--text);padding:10px 12px;border-radius:10px;font-size:14px;min-height:44px}
  textarea{min-height:120px;resize:vertical}
  table{width:100%;border-collapse:collapse;}th,td{padding:10px 12px;border-bottom:1px solid var(--muted);text-align:left;font-size:14px;}th{background:rgba(255,122,26,.08);color:#ffa552;}
  .status-pill{padding:4px 10px;border-radius:99px;font-size:12px;font-weight:bold;color:#fff;text-align:center;display:inline-block;background:var(--accent);}
  .progress-bar-container{background:var(--muted);border-radius:99px;height:10px;width:100%;overflow:hidden;}
  .progress-bar{background:var(--accent);height:100%;width:0%;transition:.3s;}
  .masp-tabs{display:flex;gap:5px;margin-bottom:15px;flex-wrap:wrap;}
  .masp-tab{flex:1;padding:10px;background:var(--muted);border:1px solid #2a3a55;border-radius:8px;cursor:pointer;text-align:center;font-size:13px;font-weight:600;}
  .masp-tab.active{background:linear-gradient(180deg,#ff7a1a,#e85d04);border-color:transparent;}
  .masp-tab-content{padding-top:15px;border-top:1px solid var(--muted);}
  .action-item-block{padding:12px;border:1px solid var(--muted);border-radius:12px;background:var(--card);position:relative;margin-top:10px;}
  .remove-action-btn{position:absolute;top:5px;right:5px;background:none;border:none;color:#fca5a5;font-size:1.5rem;cursor:pointer;}
  .attachments-section{margin-top:15px;padding-top:15px;border-top:1px dashed var(--muted);}
  .attachment-drop-zone{padding:10px;font-size:12px;margin-top:5px;border:2px dashed var(--muted);text-align:center;cursor:pointer;border-radius:8px;}
  .attachment-preview-grid{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;}
  .attachment-item{width:80px;height:80px;position:relative;}
  .attachment-item img,.attachment-item .file-icon{width:100%;height:100%;object-fit:cover;border-radius:8px;}
  .attachment-item .file-icon{background:var(--muted);display:flex;align-items:center;justify-content:center;font-size:11px;padding:5px;}
  .attachment-item .remove-attachment{position:absolute;top:-5px;right:-5px;background:var(--bad);color:#fff;border:none;border-radius:50%;width:20px;height:20px;cursor:pointer;}
  #record-counter{background:rgba(255,255,255,.02);border:1px solid #1e2f4d;border-radius:12px;padding:12px;}
  #record-counter p{margin:8px 0;display:flex;justify-content:space-between;}#record-counter span{color:var(--accent);font-weight:bold;}
  #toast-container{position:fixed;top:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:10px;}
  .toast{padding:12px 18px;border-radius:12px;color:#fff;font-weight:600;opacity:0;transform:translateX(100%);transition:all .4s;}
  .toast.show{opacity:1;transform:translateX(0);}
  .toast.success{background:linear-gradient(90deg,#22c55e,#16a34a);}.toast.error{background:linear-gradient(90deg,#ef4444,#dc2626);}.toast.info{background:linear-gradient(90deg,#ff7a1a,#e85d04);}
  @media print{body{display:block;color:#000;background:#fff;}header,aside,.hidden-print,.btn,.masp-tabs{display:none !important;}.masp-tab-content{display:block !important;}}
</style>
</head>
<body>
<div id="toast-container"></div>
<header>
  <div class="header-title"><h1>🛡️ EPQS SYSTEM</h1><p class="subtitle">Gerenciador MASP</p><p class="dev-credit">Desenvolvido por Marcos Garçon</p></div>
  <div style="display:flex;gap:8px;flex-wrap:wrap;">
    <button class="btn ghost" id="btn-restore-backup">Restaurar</button>
    <button class="btn ghost" id="btn-download-backup">Backup</button>
    <button class="btn ghost" id="btn-archive-and-clear" style="color:var(--warn);">Arquivar</button>
    <button class="btn primary" id="btn-export-pdf">PDF</button>
  </div>
</header>
<aside>
  <div id="record-counter"><h4>Registros</h4><p>MASPs: <span id="masp-count">0</span></p></div>
</aside>
<main>
  <div id="dashboard-container">
    <section>
      <div style="display:flex;justify-content:space-between;align-items:center;"><h2>Projetos MASP</h2><button id="btn-new-masp" class="btn primary">+ Novo MASP</button></div>
      <table id="masp-list-table"><thead><tr><th>Título</th><th>Status</th><th>Progresso</th><th>Data</th><th class="hidden-print">Ações</th></tr></thead><tbody></tbody></table>
    </section>
  </div>
  <div id="form-container" class="hidden">
    <section>
      <form id="masp-form">
        <input type="hidden" id="masp-id">
        <div style="text-align:right;margin-bottom:5px;font-size:14px;"><span id="progress-summary">0/8</span></div>
        <div class="progress-bar-container"><div id="progress-bar" class="progress-bar"></div></div>
        <section>
          <h4>Informações Gerais</h4>
          <div class="grid">
            <div class="field" style="grid-column:span 6;"><label>Título do Problema</label><input type="text" id="masp-title" required></div>
            <div class="field" style="grid-column:span 3;"><label>Data Início</label><input type="date" id="masp-start-date"></div>
            <div class="field" style="grid-column:span 3;"><label>Status</label><select id="masp-status"><option value="aberto">Aberto</option><option value="andamento">Em Andamento</option><option value="concluido">Concluído</option></select></div>
            <div class="field" style="grid-column:span 12;"><label>Equipe</label><input type="text" id="masp-team"></div>
          </div>
        </section>
        <nav class="masp-tabs"></nav>
        <div id="masp-steps-container"></div>
        <div style="display:flex;gap:10px;" class="hidden-print">
          <button type="submit" class="btn primary">Salvar MASP</button>
          <button type="button" id="btn-cancel" class="btn ghost">Voltar</button>
        </div>
      </form>
    </section>
  </div>
</main>
<template id="masp-step-template">
  <div class="masp-tab-content">
    <div class="field"><label></label><textarea rows="6"></textarea></div>
    <div class="attachments-section"></div>
  </div>
</template>
<template id="attachment-ui-template"><div class="field"><input type="file" class="attachments-input hidden" multiple><div class="attachment-drop-zone">Arraste/clique para anexar</div><div class="attachment-preview-grid"></div></div></template>
<template id="action-plan-form-template">
  <div class="action-item-block"><button type="button" class="remove-action-btn hidden-print">&times;</button>
    <div class="grid">
      <div class="field" style="grid-column:span 12;"><label>Ação</label><textarea class="action-input" rows="2"></textarea></div>
      <div class="field" style="grid-column:span 3;"><label>Responsável</label><input type="text" class="responsible-input"></div>
      <div class="field" style="grid-column:span 3;"><label>Status</label><select class="status-input"><option value="aberto">Aberto</option><option value="andamento">Em Andamento</option><option value="concluido">Concluído</option></select></div>
      <div class="field" style="grid-column:span 3;"><label>Início</label><input type="date" class="start-date-input"></div>
      <div class="field" style="grid-column:span 3;"><label>Final</label><input type="date" class="end-date-input"></div>
      <div class="field" style="grid-column:span 12;border-top:1px solid var(--muted);padding-top:12px;margin-top:6px;"><label>Anexos</label><div class="attachments-section" style="border-top:none;padding-top:0;margin-top:0;"></div></div>
    </div>
  </div>
</template>
<script>
document.addEventListener('DOMContentLoaded',()=>{
  let masps=[];const DB_KEY='itp_masps_v1';
  const STEPS=["1. Identificação","2. Observação","3. Análise","4. Plano de Ação","5. Ação","6. Verificação","7. Padronização","8. Conclusão"];
  const PROMPTS=["Descreva o problema...","Observe e colete dados...","Identifique causas raiz...","Use o gerenciador de planos...","Execute as ações...","Verifique eficácia...","Padronize a solução...","Reflita sobre lições aprendidas..."];
  const main=document.querySelector('main'),dash=document.getElementById('dashboard-container'),form=document.getElementById('form-container'),f=document.getElementById('masp-form'),listBody=document.querySelector('#masp-list-table tbody'),countSpan=document.getElementById('masp-count'),tabsC=document.querySelector('.masp-tabs'),stepsC=document.getElementById('masp-steps-container');
  const tplStep=document.getElementById('masp-step-template'),tplAtt=document.getElementById('attachment-ui-template'),tplAP=document.getElementById('action-plan-form-template');
  const showToast=(m,t='info')=>{const c=document.getElementById('toast-container');const el=document.createElement('div');el.className=`toast ${t}`;el.textContent=m;c.appendChild(el);setTimeout(()=>el.classList.add('show'),10);setTimeout(()=>{el.classList.remove('show');el.addEventListener('transitionend',()=>el.remove())},4000);};
  const save=()=>localStorage.setItem(DB_KEY,JSON.stringify(masps));
  const load=()=>{masps=JSON.parse(localStorage.getItem(DB_KEY))||[];};
  const showForm=()=>{dash.classList.add('hidden');form.classList.remove('hidden');};
  const showDash=()=>{f.reset();form.classList.add('hidden');dash.classList.remove('hidden');renderList();};
  const updateProgress=()=>{const tas=stepsC.querySelectorAll('textarea');const fc=Array.from(tas).filter(t=>t.value.trim()).length;const p=(fc/STEPS.length)*100;document.getElementById('progress-bar').style.width=`${p}%`;document.getElementById('progress-summary').textContent=`${fc}/${STEPS.length}`;};
  const renderList=()=>{listBody.innerHTML='';if(!masps.length)listBody.innerHTML='<tr><td colspan="5">Nenhum MASP.</td></tr>';else masps.sort((a,b)=>b.id-a.id).forEach(m=>{const fs=(m.steps||[]).filter(s=>(s.content&&s.content.trim())||(s.actionPlans&&s.actionPlans.length)).length,p=(fs/STEPS.length)*100;const r=listBody.insertRow();r.innerHTML=`<td>${m.title||'N/A'}</td><td><span class="status-pill">${m.status||'N/A'}</span></td><td><div class="progress-bar-container"><div class="progress-bar" style="width:${p}%;"></div></div></td><td>${m.startDate?new Date(m.startDate+'T00:00:00').toLocaleDateString():'N/A'}</td><td class="hidden-print"><button class="btn ghost btn-edit" data-id="${m.id}">Editar</button> <button class="btn ghost btn-delete" data-id="${m.id}">Excluir</button></td>`;});countSpan.textContent=masps.length;};
  const createTabs=()=>{tabsC.innerHTML='';stepsC.innerHTML='';STEPS.forEach((n,i)=>{const t=document.createElement('div');t.className='masp-tab';t.textContent=n;t.dataset.index=i;if(i===0)t.classList.add('active');tabsC.appendChild(t);const cl=tplStep.content.cloneNode(true),cd=cl.querySelector('.masp-tab-content'),lb=cl.querySelector('label'),ta=cl.querySelector('textarea');lb.textContent=n;ta.placeholder=PROMPTS[i];cd.dataset.index=i;if(i!==0)cd.classList.add('hidden');if(i===3){ta.classList.add('hidden');lb.classList.add('hidden');const apc=document.createElement('div');apc.className='action-plan-container';const ab=document.createElement('button');ab.type='button';ab.className='btn ghost btn-add-action-plan';ab.textContent='+ Adicionar Ação';ab.style.width='100%';cd.appendChild(apc);cd.appendChild(ab);}const ac=cd.querySelector('.attachments-section');ac.appendChild(tplAtt.content.cloneNode(true));stepsC.appendChild(cl);});};
  const addAtt=(g,d)=>{const it=document.createElement('div');it.className='attachment-item';it.dataset.fileName=d.name;it.dataset.fileData=d.data;it.dataset.fileType=d.type;it.innerHTML=`${d.type.startsWith('image/')?`<img src="${d.data}">`:`<div class="file-icon">📄${d.name}</div>`}<button type="button" class="remove-attachment hidden-print">&times;</button>`;g.appendChild(it);};
  const handleFiles=(fs,c)=>{const g=c.querySelector('.attachment-preview-grid');for(const f of fs){if(f.size>5*1024*1024){showToast('>5MB','error');continue;}const r=new FileReader();r.onload=e=>addAtt(g,{name:f.name,type:f.type,data:e.target.result});r.readAsDataURL(f);}};
  const getAtts=(c)=>{const a=[];c.querySelectorAll('.attachment-item').forEach(i=>a.push({name:i.dataset.fileName,type:i.dataset.fileType,data:i.dataset.fileData}));return a;};
  const renderAPs=(c,plans=[])=>{c.innerHTML='';plans.forEach(p=>{const cl=tplAP.content.cloneNode(true),b=cl.querySelector('.action-item-block');b.querySelector('.action-input').value=p.action||'';b.querySelector('.responsible-input').value=p.responsible||'';b.querySelector('.status-input').value=p.status||'aberto';b.querySelector('.start-date-input').value=p.startDate||'';b.querySelector('.end-date-input').value=p.endDate||'';const atts=b.querySelector('.attachments-section');atts.appendChild(tplAtt.content.cloneNode(true));if(p.attachments){const g=atts.querySelector('.attachment-preview-grid');p.attachments.forEach(a=>addAtt(g,a));}c.appendChild(cl);});};
  document.getElementById('btn-new-masp').addEventListener('click',()=>{f.reset();document.getElementById('masp-id').value='';document.getElementById('masp-start-date').value=new Date().toISOString().slice(0,10);createTabs();updateProgress();showForm();});
  document.getElementById('btn-cancel').addEventListener('click',showDash);
  tabsC.addEventListener('click',e=>{if(e.target.classList.contains('masp-tab')){const i=e.target.dataset.index;tabsC.querySelectorAll('.masp-tab').forEach(t=>t.classList.remove('active'));stepsC.querySelectorAll('.masp-tab-content').forEach(c=>c.classList.add('hidden'));e.target.classList.add('active');stepsC.querySelector(`.masp-tab-content[data-index="${i}"]`).classList.remove('hidden');}});
  main.addEventListener('click',e=>{const t=e.target;if(t.classList.contains('btn-edit')){const m=masps.find(x=>x.id==t.dataset.id);if(m){f.reset();createTabs();document.getElementById('masp-id').value=m.id;document.getElementById('masp-title').value=m.title||'';document.getElementById('masp-start-date').value=m.startDate||'';document.getElementById('masp-status').value=m.status||'aberto';document.getElementById('masp-team').value=m.team||'';(m.steps||[]).forEach((s,i)=>{const cd=stepsC.querySelector(`.masp-tab-content[data-index="${i}"]`);if(cd){if(i===3)renderAPs(cd.querySelector('.action-plan-container'),s.actionPlans);else cd.querySelector('textarea').value=s.content||'';const g=cd.querySelector('.attachment-preview-grid');(s.attachments||[]).forEach(a=>addAtt(g,a));}});updateProgress();showForm();}}if(t.classList.contains('btn-delete')){if(confirm('Excluir?')){masps=masps.filter(x=>x.id!=t.dataset.id);save();renderList();}}if(t.classList.contains('btn-add-action-plan')){const c=t.previousElementSibling;const cl=tplAP.content.cloneNode(true);cl.querySelector('.attachments-section').appendChild(tplAtt.content.cloneNode(true));c.appendChild(cl);}if(t.classList.contains('remove-action-btn'))t.closest('.action-item-block').remove();if(t.classList.contains('attachment-drop-zone'))t.previousElementSibling.click();if(t.classList.contains('remove-attachment'))t.closest('.attachment-item').remove();});
  main.addEventListener('change',e=>{if(e.target.classList.contains('attachments-input'))handleFiles(e.target.files,e.target.closest('.field, .attachments-section'));});
  f.addEventListener('input',updateProgress);
  f.addEventListener('submit',e=>{e.preventDefault();const id=document.getElementById('masp-id').value,d={id:id?parseInt(id):Date.now(),title:document.getElementById('masp-title').value,startDate:document.getElementById('masp-start-date').value,status:document.getElementById('masp-status').value,team:document.getElementById('masp-team').value,steps:[]};stepsC.querySelectorAll('.masp-tab-content').forEach((cd,i)=>{const sd={attachments:getAtts(cd.querySelector('.attachments-section'))};if(i===3){sd.actionPlans=[];cd.querySelectorAll('.action-item-block').forEach(b=>sd.actionPlans.push({action:b.querySelector('.action-input').value,responsible:b.querySelector('.responsible-input').value,status:b.querySelector('.status-input').value,startDate:b.querySelector('.start-date-input').value,endDate:b.querySelector('.end-date-input').value,attachments:getAtts(b.querySelector('.attachments-section'))}));}else sd.content=cd.querySelector('textarea').value;d.steps.push(sd);});if(id){const idx=masps.findIndex(m=>m.id==id);if(idx>-1)masps[idx]=d;}else masps.push(d);save();showToast('Salvo!','success');showDash();});
  document.getElementById('btn-export-pdf').addEventListener('click',()=>{if(form.classList.contains('hidden')){showToast('Abra um MASP.','info');return;}window.print();});
  document.getElementById('btn-download-backup').addEventListener('click',()=>{const b=new Blob([JSON.stringify(masps,null,2)],{type:'application/json'});const l=document.createElement("a");l.href=URL.createObjectURL(b);l.download=`itp_masp_${new Date().toISOString().slice(0,10)}.json`;l.click();});
  document.getElementById('btn-restore-backup').addEventListener('click',()=>{const i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=e=>{const r=new FileReader();r.onload=ev=>{if(!confirm('Substituir?'))return;try{const d=JSON.parse(ev.target.result);if(Array.isArray(d)){masps=d;save();renderList();showToast('Restaurado!');}}catch(err){showToast('Inválido.','error');}};r.readAsText(e.target.files[0]);};i.click();});
  document.getElementById('btn-archive-and-clear').addEventListener('click',()=>{if(confirm("Apagar?")){document.getElementById('btn-download-backup').click();localStorage.removeItem(DB_KEY);setTimeout(()=>location.reload(),2000);}});
  load();showDash();
});
</script>
</body>
</html>
