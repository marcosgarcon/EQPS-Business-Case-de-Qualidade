<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d3d78"/>
      <stop offset="55%" stop-color="#0a2a55"/>
      <stop offset="100%" stop-color="#081d3d"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffa552"/>
      <stop offset="100%" stop-color="#e85d04"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>
  </defs>

  <!-- Hexagon body (engineering / structure) -->
  <polygon points="256,20 452,138 452,374 256,492 60,374 60,138"
           fill="url(#bgGrad)" stroke="url(#ringGrad)" stroke-width="14"/>

  <!-- Inner hexagon outline detail -->
  <polygon points="256,60 416,152 416,360 256,452 96,360 96,152"
           fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>

  <!-- Statistics trend line (light green) -->
  <polyline points="128,300 190,255 240,290 300,210 372,168"
            fill="none" stroke="url(#greenGrad)" stroke-width="10"
            stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  <circle cx="372" cy="168" r="12" fill="#86efac"/>
  <circle cx="300" cy="210" r="8" fill="#86efac" opacity="0.85"/>
  <circle cx="240" cy="290" r="8" fill="#86efac" opacity="0.85"/>
  <circle cx="190" cy="255" r="8" fill="#86efac" opacity="0.85"/>
  <circle cx="128" cy="300" r="8" fill="#86efac" opacity="0.85"/>

  <!-- Gear tooth accents (engineering), orange -->
  <g fill="#ff7a1a" opacity="0.9">
    <rect x="246" y="30" width="20" height="26" rx="4"/>
    <rect x="246" y="456" width="20" height="26" rx="4"/>
  </g>

  <!-- EQPS lettering -->
  <text x="256" y="345" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-weight="800"
        font-size="100" fill="#ffffff" letter-spacing="2">EQPS</text>
</svg>
