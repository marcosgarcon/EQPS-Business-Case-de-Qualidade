<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EPQS - Eng Process Quality and Statistics · KPI Manager</title>
    
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.29/jspdf.plugin.autotable.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        wm: { 950: '#0a1628', 900: '#0f1e36', 800: '#1a2942', 700: '#2a3a55', 600: '#3d4f6f', accent: '#4a90d9', success: '#22c55e', danger: '#ef4444', warning: '#f59e0b', text: '#f8fafc', muted: '#94a3b8' }
                    }
                }
            }
        }
    </script>
    
    <style>
        body { background-color: #0a1628; color: #f8fafc; font-family: 'Segoe UI', system-ui, sans-serif; }
        .animate-fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #0f1e36; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #4a90d9; }
        
        .card-hover:hover { transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5); border-color: #4a90d9; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;
        const { jsPDF } = window.jspdf;

        // --- Data Definitions (ATUALIZADO COM SEUS KPIs) ---
        const DEFAULT_DB = {
            kpis: {
                // 🛡️ Segurança
                ACA: { key:'ACA', name:'ACA (Acidentes c/ Afastamento)', category:'Segurança', target:0, comparator:'=', unit:'nº' },
                ASA: { key:'ASA', name:'ASA (Acidentes s/ Afastamento)', category:'Segurança', target:4, comparator:'<', unit:'nº' }, // Menor que 4
                SAFETY_ACT: { key:'SAFETY_ACT', name:'Ações de Segurança', category:'Segurança', target:100, comparator:'>=', unit:'%' }, // Caravan + Olhar Seguro

                // 💎 Qualidade
                FPY: { key:'FPY', name:'First Pass Yield (FPY)', category:'Qualidade', target:97, comparator:'>=', unit:'%' },
                SCRAP: { key:'SCRAP', name:'Scrap de Produção', category:'Qualidade', target:0.56, comparator:'<=', unit:'%' },

                // ⚡ Produtividade e Eficiência
                EF_GERAL: { key:'EF_GERAL', name:'Eficiência Geral', category:'Produtividade e Eficiência', target:56, comparator:'>=', unit:'%' },
                EF_OPER: { key:'EF_OPER', name:'Eficiência Operacional', category:'Produtividade e Eficiência', target:70, comparator:'>=', unit:'%' },
                TAXA_OPER: { key:'TAXA_OPER', name:'Taxa de Operação', category:'Produtividade e Eficiência', target:80, comparator:'>=', unit:'%' },
                TAXA_CONC: { key:'TAXA_CONC', name:'Taxa de Conclusão', category:'Produtividade e Eficiência', target:98, comparator:'>=', unit:'%' },
                PSI: { key:'PSI', name:'PSI', category:'Produtividade e Eficiência', target:100, comparator:'>=', unit:'%' },
                DOWNTIME: { key:'DOWNTIME', name:'Downtime', category:'Produtividade e Eficiência', target:2, comparator:'<=', unit:'%' }
            },
            records: {}, // { KPI_KEY: [ { date, value, reason, evidences:[] } ] }
            plans: {}    // { KPI_KEY: [ { title, status, responsible, date } ] }
        };

        // --- Helpers ---
        const Icon = ({ name, size = 18, className = "" }) => <i data-lucide={name} width={size} height={size} className={className}></i>;

        const Button = ({ children, onClick, variant = "primary", className = "", icon }) => {
            const styles = {
                primary: "bg-wm-600 hover:bg-blue-600 text-white shadow-lg",
                accent: "bg-wm-accent hover:bg-sky-400 text-wm-900 font-bold shadow-lg shadow-sky-900/20",
                danger: "bg-red-500/10 text-red-400 border border-red-500/50 hover:bg-red-500/20",
                success: "bg-green-500/10 text-green-400 border border-green-500/50 hover:bg-green-500/20",
                ghost: "bg-transparent hover:bg-wm-800 text-wm-text border border-wm-700",
            };
            return <button onClick={onClick} className={`px-4 py-2 rounded flex items-center gap-2 transition-all ${styles[variant]} ${className}`}>{icon && <Icon name={icon} size={16}/>} {children}</button>;
        };

        const Card = ({ children, className="", title, rightAction }) => (
            <div className={`bg-wm-900 border border-wm-800 rounded-xl p-5 transition-all ${className}`}>
                {(title || rightAction) && (
                    <div className="flex justify-between items-center mb-4 pb-2 border-b border-wm-800/50">
                        {title && <h3 className="font-bold text-lg text-white flex items-center gap-2">{title}</h3>}
                        {rightAction}
                    </div>
                )}
                {children}
            </div>
        );

        const checkTarget = (val, comp, target) => {
            if(val === null || val === undefined || val === '') return false;
            const v = parseFloat(val);
            const t = parseFloat(target);
            switch(comp) {
                case '>=': return v >= t;
                case '<=': return v <= t;
                case '>': return v > t;
                case '<': return v < t;
                case '=': return v === t;
                default: return false;
            }
        };

        // --- CHART COMPONENT ---
        const KpiChart = ({ records, target, label }) => {
            const chartRef = useRef(null);
            const canvasRef = useRef(null);

            useEffect(() => {
                if(chartRef.current) chartRef.current.destroy();
                if(!canvasRef.current || !records.length) return;

                const sorted = [...records].sort((a,b) => new Date(a.date) - new Date(b.date));
                const ctx = canvasRef.current.getContext('2d');
                
                chartRef.current = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: sorted.map(r => new Date(r.date).toLocaleDateString()),
                        datasets: [
                            {
                                label: 'Realizado',
                                data: sorted.map(r => r.value),
                                borderColor: '#4a90d9',
                                backgroundColor: 'rgba(56, 189, 248, 0.1)',
                                borderWidth: 2,
                                tension: 0.3,
                                fill: true
                            },
                            {
                                label: 'Meta',
                                data: sorted.map(() => target),
                                borderColor: '#10b981',
                                borderDash: [5, 5],
                                borderWidth: 2,
                                pointRadius: 0
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { labels: { color: '#94a3b8' } } },
                        scales: {
                            y: { grid: { color: '#1e293b' }, ticks: { color: '#94a3b8' } },
                            x: { grid: { color: '#1e293b' }, ticks: { color: '#94a3b8' } }
                        }
                    }
                });
                return () => { if(chartRef.current) chartRef.current.destroy(); };
            }, [records, target]);

            return <div className="h-64 w-full"><canvas ref={canvasRef}></canvas></div>;
        };

        const SummaryChart = ({ kpis, records }) => {
             const chartRef = useRef(null);
             const canvasRef = useRef(null);

             useEffect(() => {
                if(chartRef.current) chartRef.current.destroy();
                const ctx = canvasRef.current.getContext('2d');
                
                const categories = {};
                Object.values(kpis).forEach(k => {
                    if(!categories[k.category]) categories[k.category] = { total: 0, hit: 0 };
                    const recs = records[k.key] || [];
                    if(recs.length){
                         const last = recs[recs.length-1];
                         categories[k.category].total++;
                         if(checkTarget(last.value, k.comparator, k.target)) categories[k.category].hit++;
                    }
                });

                const labels = Object.keys(categories);
                const data = labels.map(c => categories[c].total ? Math.round((categories[c].hit / categories[c].total) * 100) : 0);

                chartRef.current = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: '% Aderência por Categoria',
                            data: data,
                            backgroundColor: data.map(v => v >= 80 ? '#10b981' : v >= 50 ? '#f59e0b' : '#ef4444'),
                            borderRadius: 6
                        }]
                    },
                    options: {
                        responsive: true, maintainAspectRatio: false,
                        plugins: { legend: { display: false } },
                        scales: { y: { max: 100, grid: { color: '#1e293b' }, ticks: { color: '#94a3b8' } }, x: { grid: { display: false }, ticks: { color: '#94a3b8' } } }
                    }
                });
                return () => { if(chartRef.current) chartRef.current.destroy(); };
             }, [kpis, records]);

             return <div className="h-48 w-full"><canvas ref={canvasRef}></canvas></div>;
        };


        // --- MAIN APP ---
        const App = () => {
            const [db, setDb] = useState(DEFAULT_DB);
            const [view, setView] = useState('dashboard'); // dashboard, kpi, settings
            const [selectedKpiKey, setSelectedKpiKey] = useState(null);
            const [modal, setModal] = useState({ open: false, type: '', data: null });

            // Load/Save
            useEffect(() => {
                const saved = localStorage.getItem('wm-kpi-pro-v3-fixed'); // Mudança de chave para não conflitar
                if(saved) {
                    setDb(JSON.parse(saved));
                }
                setTimeout(()=> window.lucide.createIcons(), 100);
            }, []);

            useEffect(() => {
                localStorage.setItem('wm-kpi-pro-v3-fixed', JSON.stringify(db));
                setTimeout(()=> window.lucide.createIcons(), 100);
            }, [db, view, selectedKpiKey]);

            // CRUD Logic
            const addRecord = (kpiKey, record) => {
                setDb(prev => {
                    const newRecs = [...(prev.records[kpiKey] || []), { ...record, id: Date.now() }];
                    newRecs.sort((a,b) => new Date(a.date) - new Date(b.date));
                    return { ...prev, records: { ...prev.records, [kpiKey]: newRecs } };
                });
            };

            const deleteRecord = (kpiKey, id) => {
                if(!confirm("Excluir registro?")) return;
                setDb(prev => ({
                    ...prev,
                    records: { ...prev.records, [kpiKey]: prev.records[kpiKey].filter(r => r.id !== id) }
                }));
            };

            const addPlan = (kpiKey, plan) => {
                setDb(prev => ({
                    ...prev,
                    plans: { ...prev.plans, [kpiKey]: [...(prev.plans[kpiKey] || []), { ...plan, id: Date.now() }] }
                }));
            };

             const deletePlan = (kpiKey, id) => {
                setDb(prev => ({
                    ...prev,
                    plans: { ...prev.plans, [kpiKey]: prev.plans[kpiKey].filter(p => p.id !== id) }
                }));
            };

            // Views Components
            const Sidebar = () => {
                // Categorias dinâmicas baseadas nos KPIs existentes
                const categories = useMemo(() => {
                    const cats = new Set(Object.values(db.kpis).map(k => k.category));
                    return Array.from(cats);
                }, [db.kpis]);

                return (
                    <aside className="hidden md:flex flex-col w-64 border-r border-wm-800 bg-wm-950 fixed h-full z-10">
                        <div className="p-4 border-b border-wm-800">
                            <a href="index.html" className="flex items-center gap-2 text-[11px] text-wm-muted hover:text-white mb-3"><Icon name="home" size={14}/> EPQS</a>
                            <div className="flex items-center gap-3">
                                <div className="bg-wm-accent p-2 rounded-lg text-wm-950"><Icon name="bar-chart-2" size={24}/></div>
                                <div>
                                    <h1 className="font-bold text-white leading-none">KPI Manager</h1>
                                    <span className="text-xs text-wm-accent font-mono">INDUSTRIAL</span>
                                </div>
                            </div>
                        </div>
                        
                        <nav className="flex-1 overflow-y-auto p-4 space-y-6">
                            <div>
                                <div className="text-xs uppercase text-wm-muted font-bold mb-2 px-2">Geral</div>
                                <button onClick={() => { setView('dashboard'); setSelectedKpiKey(null); }} className={`w-full flex items-center gap-3 px-3 py-2 rounded text-sm transition-colors ${view === 'dashboard' ? 'bg-wm-800 text-white' : 'text-wm-muted hover:text-white hover:bg-wm-900'}`}>
                                    <Icon name="layout-dashboard" size={18}/> Dashboard
                                </button>
                                 <button onClick={() => { setView('settings'); setSelectedKpiKey(null); }} className={`w-full flex items-center gap-3 px-3 py-2 rounded text-sm transition-colors ${view === 'settings' ? 'bg-wm-800 text-white' : 'text-wm-muted hover:text-white hover:bg-wm-900'}`}>
                                    <Icon name="settings" size={18}/> Configurações
                                </button>
                            </div>

                            {categories.map(cat => (
                                <div key={cat}>
                                    <div className="text-xs uppercase text-wm-muted font-bold mb-2 px-2 truncate" title={cat}>{cat}</div>
                                    <div className="space-y-1">
                                        {Object.values(db.kpis).filter(k => k.category === cat).map(k => (
                                            <button key={k.key} onClick={() => { setView('kpi'); setSelectedKpiKey(k.key); }} className={`w-full flex items-center justify-between px-3 py-2 rounded text-sm transition-colors ${selectedKpiKey === k.key ? 'bg-wm-accent text-wm-900 font-bold' : 'text-wm-muted hover:text-white hover:bg-wm-900'}`}>
                                                <span className="truncate pr-2">{k.name}</span>
                                                {db.records[k.key]?.length > 0 && (
                                                    <span className={`w-2 h-2 rounded-full flex-shrink-0 ${checkTarget(db.records[k.key][db.records[k.key].length-1].value, k.comparator, k.target) ? 'bg-green-500' : 'bg-red-500'}`}></span>
                                                )}
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            ))}
                        </nav>
                        <div className="p-3 border-t border-wm-800 text-center text-[10px] text-wm-muted">EPQS - Eng Process Quality and Statistics · Sistema Integrado de Ferramentas · Desenvolvido por Marcos Garçon</div>
                    </aside>
                );
            };

            const DashboardView = () => {
                const kpis = Object.values(db.kpis);
                
                return (
                    <div className="animate-fade-in p-6 md:ml-64">
                         <div className="flex justify-between items-center mb-6">
                            <h2 className="text-2xl font-bold text-white">Visão Geral Consolidada</h2>
                            <div className="text-sm text-wm-muted">Monitoramento em Tempo Real</div>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                             <Card title="Aderência Global">
                                <SummaryChart kpis={db.kpis} records={db.records} />
                             </Card>
                             <Card className="md:col-span-2" title="Alertas de Desvio (Fora da Meta)">
                                <div className="space-y-3 max-h-48 overflow-y-auto pr-2 custom-scrollbar">
                                    {kpis.map(k => {
                                        const recs = db.records[k.key] || [];
                                        const last = recs.length ? recs[recs.length-1] : null;
                                        // Mostra se não tiver registro (opcional) ou se estiver fora da meta
                                        if(!last || checkTarget(last.value, k.comparator, k.target)) return null;
                                        return (
                                            <div key={k.key} className="flex items-center justify-between bg-red-500/10 border border-red-500/20 p-3 rounded-lg">
                                                <div className="flex items-center gap-3">
                                                    <Icon name="alert-triangle" className="text-red-400"/>
                                                    <div>
                                                        <div className="font-bold text-white">{k.name}</div>
                                                        <div className="text-xs text-red-300">Atual: {last.value} {k.unit} | Meta: {k.comparator} {k.target}</div>
                                                    </div>
                                                </div>
                                                <Button variant="ghost" className="text-xs" onClick={()=>{setView('kpi'); setSelectedKpiKey(k.key)}}>Ver</Button>
                                            </div>
                                        )
                                    })}
                                    {kpis.every(k => {
                                        const recs = db.records[k.key] || [];
                                        const last = recs.length ? recs[recs.length-1] : null;
                                        return !last || checkTarget(last.value, k.comparator, k.target);
                                    }) && <div className="text-center text-green-400 py-4 flex flex-col items-center"><Icon name="check-circle" size={32} className="mb-2"/>Todos os indicadores dentro da meta!</div>}
                                </div>
                             </Card>
                        </div>

                        <h3 className="text-xl font-bold text-white mb-4">Painel de Indicadores</h3>
                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
                            {kpis.map(k => {
                                const recs = db.records[k.key] || [];
                                const last = recs.length ? recs[recs.length-1] : null;
                                const isOk = last ? checkTarget(last.value, k.comparator, k.target) : true; // Sem dados considera neutro/ok visualmente
                                
                                return (
                                    <div key={k.key} onClick={()=>{setView('kpi'); setSelectedKpiKey(k.key)}} className="bg-wm-900 border border-wm-800 p-4 rounded-xl cursor-pointer card-hover relative overflow-hidden group">
                                        <div className={`absolute top-0 left-0 w-1 h-full ${!last ? 'bg-gray-600' : isOk ? 'bg-emerald-500' : 'bg-red-500'}`}></div>
                                        <div className="flex justify-between items-start mb-2 pl-3">
                                            <div className="text-xs font-bold uppercase text-wm-muted truncate pr-2" title={k.category}>{k.category}</div>
                                            {last && <Icon name={isOk ? "check-circle" : "alert-circle"} size={16} className={isOk ? "text-emerald-500" : "text-red-500"}/>}
                                        </div>
                                        <div className="pl-3 mb-2">
                                            <div className="font-bold text-white truncate" title={k.name}>{k.name}</div>
                                        </div>
                                        <div className="pl-3 flex justify-between items-end">
                                            <div>
                                                <div className="text-2xl font-bold text-white leading-none">{last ? last.value : '-'} <span className="text-sm font-normal text-wm-muted">{k.unit}</span></div>
                                            </div>
                                            <div className="text-xs text-right text-wm-muted bg-wm-950 px-2 py-1 rounded">
                                                Meta: {k.comparator} {k.target}
                                            </div>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                );
            };

            const KPIView = () => {
                const kpi = db.kpis[selectedKpiKey];
                const recs = db.records[selectedKpiKey] || [];
                const plans = db.plans[selectedKpiKey] || [];
                const last = recs.length ? recs[recs.length-1] : null;
                const isOk = last ? checkTarget(last.value, kpi.comparator, kpi.target) : true;
                
                // Form States
                const [tab, setTab] = useState('overview'); // overview, list, plans
                const [form, setForm] = useState({ date: new Date().toISOString().split('T')[0], value: '', reason: '', evidence: null });

                const handleAdd = () => {
                    if(!form.value) return alert("Insira um valor");
                    addRecord(kpi.key, form);
                    setForm({ ...form, value: '', reason: '', evidence: null });
                };

                return (
                    <div className="animate-fade-in p-6 md:ml-64">
                        {/* Header KPI */}
                        <div className="flex flex-col md:flex-row md:items-center justify-between mb-6 gap-4">
                            <div>
                                <div className="flex items-center gap-2 text-sm text-wm-accent mb-1 cursor-pointer hover:underline" onClick={()=>setView('dashboard')}><Icon name="arrow-left" size={14}/> Voltar ao Dashboard</div>
                                <h2 className="text-3xl font-bold text-white flex items-center gap-3">
                                    {kpi.name}
                                    {last && (
                                        <span className={`text-sm px-2 py-1 rounded border ${isOk ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20' : 'bg-red-500/10 text-red-400 border-red-500/20'}`}>
                                            {isOk ? 'Meta Atingida' : 'Fora da Meta'}
                                        </span>
                                    )}
                                </h2>
                                <span className="text-wm-muted text-sm">{kpi.category}</span>
                            </div>
                            <div className="flex gap-2">
                                <div className="text-right px-4 border-r border-wm-800">
                                    <div className="text-xs text-wm-muted uppercase">Meta Estabelecida</div>
                                    <div className="text-xl font-bold text-white">{kpi.comparator} {kpi.target} {kpi.unit}</div>
                                </div>
                                <div className="text-right px-4">
                                    <div className="text-xs text-wm-muted uppercase">Última Medição</div>
                                    <div className={`text-xl font-bold ${!last ? 'text-gray-500' : isOk ? 'text-emerald-400' : 'text-red-400'}`}>{last ? last.value : '-'}</div>
                                </div>
                            </div>
                        </div>

                        {/* Input Rápido */}
                        <Card className="mb-6 border-l-4 border-l-wm-accent bg-wm-800/50">
                            <h4 className="text-sm font-bold text-white mb-3 flex items-center gap-2"><Icon name="plus-circle" size={16}/> Novo Lançamento</h4>
                            <div className="grid grid-cols-1 md:grid-cols-4 gap-4 items-end">
                                <div>
                                    <label className="text-xs text-wm-muted mb-1 block">Data</label>
                                    <input type="date" className="w-full bg-wm-900 border border-wm-700 rounded p-2 text-white" value={form.date} onChange={e=>setForm({...form, date: e.target.value})} />
                                </div>
                                <div>
                                    <label className="text-xs text-wm-muted mb-1 block">Valor ({kpi.unit})</label>
                                    <input type="number" step="0.01" className="w-full bg-wm-900 border border-wm-700 rounded p-2 text-white focus:border-wm-accent outline-none" placeholder="0.00" value={form.value} onChange={e=>setForm({...form, value: e.target.value})} />
                                </div>
                                <div>
                                    <label className="text-xs text-wm-muted mb-1 block">Motivo / Obs (Opcional)</label>
                                    <input type="text" className="w-full bg-wm-900 border border-wm-700 rounded p-2 text-white" placeholder="Justificativa..." value={form.reason} onChange={e=>setForm({...form, reason: e.target.value})} />
                                </div>
                                <Button variant="accent" onClick={handleAdd} icon="save">Salvar Registro</Button>
                            </div>
                        </Card>

                        {/* Tabs */}
                        <div className="flex gap-1 mb-6 border-b border-wm-800">
                            <button onClick={()=>setTab('overview')} className={`px-4 py-2 border-b-2 transition-colors ${tab === 'overview' ? 'border-wm-accent text-white font-bold' : 'border-transparent text-wm-muted hover:text-white'}`}>Gráfico</button>
                            <button onClick={()=>setTab('list')} className={`px-4 py-2 border-b-2 transition-colors ${tab === 'list' ? 'border-wm-accent text-white font-bold' : 'border-transparent text-wm-muted hover:text-white'}`}>Histórico</button>
                            <button onClick={()=>setTab('plans')} className={`px-4 py-2 border-b-2 transition-colors ${tab === 'plans' ? 'border-wm-accent text-white font-bold' : 'border-transparent text-wm-muted hover:text-white'}`}>Planos de Ação ({plans.length})</button>
                        </div>

                        {/* Tab Content */}
                        {tab === 'overview' && (
                            <div className="animate-fade-in">
                                <Card title="Evolução Temporal">
                                    <KpiChart records={recs} target={kpi.target} />
                                </Card>
                            </div>
                        )}

                        {tab === 'list' && (
                            <div className="animate-fade-in bg-wm-900 rounded-xl border border-wm-800 overflow-hidden">
                                <table className="w-full text-left text-sm">
                                    <thead className="bg-wm-950 text-wm-muted uppercase text-xs">
                                        <tr>
                                            <th className="p-4">Data</th>
                                            <th className="p-4">Valor</th>
                                            <th className="p-4">Status</th>
                                            <th className="p-4">Observação</th>
                                            <th className="p-4 text-right">Ação</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-wm-800 text-gray-300">
                                        {[...recs].reverse().map(r => (
                                            <tr key={r.id} className="hover:bg-wm-800/50">
                                                <td className="p-4">{new Date(r.date).toLocaleDateString()}</td>
                                                <td className="p-4 font-bold text-white">{r.value} <span className="text-xs font-normal text-wm-muted">{kpi.unit}</span></td>
                                                <td className="p-4">
                                                    {checkTarget(r.value, kpi.comparator, kpi.target) 
                                                        ? <span className="text-emerald-400 flex items-center gap-1"><Icon name="check" size={14}/> OK</span> 
                                                        : <span className="text-red-400 flex items-center gap-1"><Icon name="x" size={14}/> NOK</span>
                                                    }
                                                </td>
                                                <td className="p-4 text-wm-muted truncate max-w-xs">{r.reason || '-'}</td>
                                                <td className="p-4 text-right">
                                                    <button onClick={()=>deleteRecord(kpi.key, r.id)} className="text-red-400 hover:text-red-300"><Icon name="trash-2" size={16}/></button>
                                                </td>
                                            </tr>
                                        ))}
                                        {recs.length === 0 && <tr><td colSpan="5" className="p-8 text-center text-wm-muted">Nenhum registro encontrado.</td></tr>}
                                    </tbody>
                                </table>
                            </div>
                        )}

                        {tab === 'plans' && (
                            <div className="animate-fade-in space-y-4">
                                <div className="flex justify-end">
                                    <Button variant="ghost" icon="plus" onClick={() => setModal({open:true, type:'plan', kpiKey: kpi.key})}>Novo Plano</Button>
                                </div>
                                {plans.map(p => (
                                    <div key={p.id} className="bg-wm-900 border border-wm-800 p-4 rounded-lg flex justify-between items-start">
                                        <div>
                                            <div className="font-bold text-white">{p.title}</div>
                                            <div className="text-sm text-wm-muted mt-1">Resp: {p.responsible} | Prazo: {new Date(p.date).toLocaleDateString()}</div>
                                            <div className="mt-2 text-xs bg-wm-800 px-2 py-1 rounded inline-block">{p.status}</div>
                                        </div>
                                        <button onClick={()=>deletePlan(kpi.key, p.id)} className="text-red-400 p-2"><Icon name="trash-2" size={16}/></button>
                                    </div>
                                ))}
                                {plans.length === 0 && <div className="text-center p-8 border border-dashed border-wm-700 rounded text-wm-muted">Nenhum plano de ação.</div>}
                            </div>
                        )}
                    </div>
                );
            };

            const SettingsView = () => (
                <div className="animate-fade-in p-6 md:ml-64">
                    <h2 className="text-2xl font-bold text-white mb-6">Configurações</h2>
                    <Card title="Gerenciar KPIs e Metas">
                        <div className="overflow-x-auto">
                            <table className="w-full text-left text-sm text-wm-muted">
                                <thead className="bg-wm-950 text-xs uppercase">
                                    <tr>
                                        <th className="p-3">Chave</th>
                                        <th className="p-3">Nome</th>
                                        <th className="p-3">Categoria</th>
                                        <th className="p-3">Meta</th>
                                        <th className="p-3">Regra</th>
                                        <th className="p-3">Unidade</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-wm-800">
                                    {Object.values(db.kpis).map(k => (
                                        <tr key={k.key}>
                                            <td className="p-3 font-mono text-wm-accent">{k.key}</td>
                                            <td className="p-3 text-white">{k.name}</td>
                                            <td className="p-3">{k.category}</td>
                                            <td className="p-3">{k.target}</td>
                                            <td className="p-3 font-mono">{k.comparator}</td>
                                            <td className="p-3">{k.unit}</td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                        <div className="mt-4 p-4 bg-wm-800/50 rounded text-sm text-center">
                            Os KPIs são definidos no código para garantir a padronização conforme solicitado.
                        </div>
                    </Card>
                    <div className="mt-6">
                        <Button variant="danger" icon="trash" onClick={()=>{
                            if(confirm("Resetar todo o banco de dados para os padrões de fábrica?")) {
                                localStorage.removeItem('wm-kpi-pro-v3-fixed');
                                window.location.reload();
                            }
                        }}>Restaurar Padrão de Fábrica</Button>
                    </div>
                </div>
            );

            // Modal Component
            const Modal = () => {
                if(!modal.open) return null;
                const [pForm, setPForm] = useState({ title: '', responsible: '', date: '', status: 'Aberto' });

                const savePlan = () => {
                    if(!pForm.title) return;
                    addPlan(modal.kpiKey, pForm);
                    setModal({ open: false, type: '', data: null });
                };

                return (
                    <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 animate-fade-in">
                        <div className="bg-wm-900 border border-wm-700 rounded-xl w-full max-w-md p-6 shadow-2xl">
                            <h3 className="text-xl font-bold text-white mb-4">Novo Plano de Ação</h3>
                            <div className="space-y-4">
                                <div>
                                    <label className="block text-xs text-wm-muted mb-1">O que fazer?</label>
                                    <input className="w-full bg-wm-950 border border-wm-700 rounded p-2 text-white" value={pForm.title} onChange={e=>setPForm({...pForm, title: e.target.value})} autoFocus/>
                                </div>
                                <div>
                                    <label className="block text-xs text-wm-muted mb-1">Responsável</label>
                                    <input className="w-full bg-wm-950 border border-wm-700 rounded p-2 text-white" value={pForm.responsible} onChange={e=>setPForm({...pForm, responsible: e.target.value})}/>
                                </div>
                                <div>
                                    <label className="block text-xs text-wm-muted mb-1">Prazo</label>
                                    <input type="date" className="w-full bg-wm-950 border border-wm-700 rounded p-2 text-white" value={pForm.date} onChange={e=>setPForm({...pForm, date: e.target.value})}/>
                                </div>
                            </div>
                            <div className="flex justify-end gap-2 mt-6">
                                <Button variant="ghost" onClick={()=>setModal({open:false})}>Cancelar</Button>
                                <Button variant="success" onClick={savePlan}>Salvar</Button>
                            </div>
                        </div>
                    </div>
                );
            };

            return (
                <div className="min-h-screen bg-wm-950 flex">
                    <Sidebar />
                    <main className="flex-1 min-w-0">
                        {view === 'dashboard' && <DashboardView />}
                        {view === 'kpi' && <KPIView />}
                        {view === 'settings' && <SettingsView />}
                    </main>
                    <Modal />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
