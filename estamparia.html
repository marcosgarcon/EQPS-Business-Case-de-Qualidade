<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EPQS SYSTEM - Controle de Estamparia</title>
<script src="https://unpkg.com/@phosphor-icons/web"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  :root{
    --bg:#0a1628;--panel:#0f1e36;--muted:#1a2942;--card:#0d1a2e;--text:#e5e7eb;
    --accent:#ff7a1a;--accent2:#ffa552;--ok:#22c55e;--warn:#f59e0b;--bad:#ef4444;
    --shadow:0 10px 30px rgba(0,0,0,.45);--radius:16px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Inter,Arial;background:linear-gradient(120deg,#081225,#0a1a35);color:var(--text);display:grid;grid-template-columns:280px 1fr;grid-template-rows:auto 1fr;gap:0;}
  header{grid-column:1/3;display:flex;align-items:center;justify-content:space-between;padding:14px 20px;background:linear-gradient(90deg,#081225,#0a1f3d);border-bottom:1px solid #1e2f4d;position:sticky;top:0;z-index:5}
  .header-title h1{margin:0;font-size:20px;letter-spacing:.4px;color:var(--text);}
  .header-title .subtitle{margin:4px 0 0 0;font-size:14px;font-weight:normal;color:var(--accent);}
  .header-title .dev-credit{margin:4px 0 0 0;font-size:11px;font-weight:normal;color:#64748b;}
  header .actions{display:flex;flex-wrap:wrap;gap:8px}
  button, .btn{background:var(--muted);color:var(--text);border:1px solid #2a3a55;border-radius:12px;padding:10px 14px;cursor:pointer;box-shadow:var(--shadow);transition:.2s;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;}
  button:hover, .btn:hover{transform:translateY(-1px);border-color:#3d4f6f}
  button.primary{background:linear-gradient(180deg,#ff7a1a,#e85d04);border-color:transparent;color:#fff}
  button.ghost{background:transparent;border-color:#3d4f6f}
  aside{border-right:1px solid #1e2f4d;background:linear-gradient(180deg,#081225,#0a1a35);padding:16px;display:flex;flex-direction:column;gap:24px;justify-content:space-between;}
  .menu{display:flex;flex-direction:column;gap:8px}
  .menu a{display:flex;gap:10px;align-items:center;text-decoration:none;color:#cbd5e1;padding:10px 12px;border:1px solid #1e2f4d;border-radius:12px;background:rgba(255,255,255,.02);cursor:pointer;}
  .menu a.active, .menu a:hover{border-color:#ff7a1a;background:rgba(255,122,26,.1);color:#ffe0c2}
  main{padding:18px;overflow:auto}
  .hidden, .tab-content.hidden{display:none !important}
  section{background:rgba(255,255,255,.03);border:1px solid #1e2f4d;border-radius:var(--radius);padding:20px;margin-bottom:20px;box-shadow:var(--shadow)}
  h2, h3, h4{margin:0 0 12px 0;color:var(--accent);} h4{color:var(--accent2)}
  .grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));}
  .field{display:flex;flex-direction:column;gap:6px}
  label{font-size:12px;color:#ffa552}
  input, select, textarea{background:#0d1a2e;border:1px solid #2a3a55;color:var(--text);padding:10px 12px;border-radius:10px;outline:none;font-family:inherit;font-size:14px;min-height:44px}
  input:focus, select:focus, textarea:focus{border-color:var(--accent)}
  table{width:100%;border-collapse:collapse;} th, td{padding:10px 12px;border-bottom:1px solid var(--muted);text-align:left;font-size:13px;vertical-align:middle;} th{background:rgba(255,122,26,.08);font-size:12px;color:#ffa552;}
  .kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;}
  .kpi-card{background:var(--card);border-radius:12px;padding:16px;text-align:center;border:1px solid #1e2f4d}
  .kpi-card h3{font-size:12px;color:var(--accent2);margin:0 0 8px 0;font-weight:normal;text-transform:uppercase;}
  .kpi-card .kpi-value{font-size:2.25rem;font-weight:bold;color:var(--accent);}
  .oee-bar{display:flex;width:100%;height:20px;background:var(--muted);border-radius:8px;overflow:hidden;margin-top:8px;}
  .oee-bar > div{height:100%;color:white;font-size:10px;display:flex;align-items:center;justify-content:center;font-weight:bold;}
  #record-counter{background:rgba(255,255,255,.02);border:1px solid #1e2f4d;border-radius:12px;padding:12px;}
  #record-counter p{margin:8px 0;color:#cbd5e1;display:flex;justify-content:space-between;}
  #record-counter span{font-weight:bold;color:var(--accent);}
  .modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);z-index:100;display:none;justify-content:center;align-items:center;padding:16px;}
  .modal.active{display:flex;}
  .modal-content{background:var(--bg);padding:24px;border-radius:16px;width:90%;max-width:700px;border:1px solid var(--muted);max-height:90vh;overflow-y:auto;}
  .toast-container{position:fixed;top:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:10px;}
  .toast{padding:12px 18px;border-radius:12px;color:white;font-weight:600;font-size:14px;box-shadow:var(--shadow);opacity:0;transform:translateX(100%);transition:all 0.4s ease;}
  .toast.show{opacity:1;transform:translateX(0);}
  .toast.success{background:linear-gradient(90deg,#22c55e,#16a34a);}
  .toast.error{background:linear-gradient(90deg,#ef4444,#dc2626);}
  .toast.info{background:linear-gradient(90deg,#ff7a1a,#e85d04);}
  @media print{body{grid-template-columns:1fr;color:#000;background:#fff;}header,aside,.hidden-print,.btn,.modal{display:none!important;}main{padding:0;overflow:visible;}section{border:1px solid #ccc;box-shadow:none;background:#fff;page-break-inside:avoid;}h2,h3,h4,label,p{color:black;}}
</style>
</head>
<body>
<div id="toast-container"></div>
<header>
  <div class="header-title">
    <h1>🛡️ EPQS SYSTEM</h1>
    <p class="subtitle">Controle de Estamparia</p>
    <p class="dev-credit">Desenvolvido por Marcos Garçon</p>
  </div>
  <div class="actions">
    <button class="btn ghost" id="btn-restore-backup">Restaurar Backup</button>
    <button class="btn ghost" id="btn-download-backup">Baixar Backup (.json)</button>
    <button class="btn ghost" id="btn-archive-and-clear" style="color:var(--warn);">Arquivar e Limpar</button>
    <button class="btn primary hidden-print" id="btn-export-pdf">Exportar PDF</button>
  </div>
</header>
<aside>
  <div>
    <div class="menu">
      <a href="#" class="tab-link active" onclick="openTab(event,'dashboard')"><i class="ph-bold ph-gauge"></i> Dashboard</a>
      <a href="#" class="tab-link" onclick="openTab(event,'setups')"><i class="ph-bold ph-sliders"></i> Ficha de Parâmetros</a>
      <a href="#" class="tab-link" onclick="openTab(event,'production')"><i class="ph-bold ph-chart-line"></i> Controle de Produção</a>
      <a href="#" class="tab-link" onclick="openTab(event,'quality')"><i class="ph-bold ph-check-square-offset"></i> Controle de Qualidade</a>
      <a href="#" class="tab-link" onclick="openTab(event,'history')"><i class="ph-bold ph-archive"></i> Histórico de Produção</a>
      <a href="#" class="tab-link" onclick="openTab(event,'cadastros')">🗳️ Cadastros</a>
      <a href="#" class="tab-link" onclick="openTab(event,'help')"><i class="ph-bold ph-question"></i> Ajuda</a>
    </div>
  </div>
  <div id="record-counter">
    <p>Ordens Ativas: <span id="op-count">0</span></p>
    <p>Fichas de Param.: <span id="setup-count">0</span></p>
  </div>
</aside>
<main id="main-content"></main>
<div id="os-modal" class="modal"></div>

<script>
document.addEventListener('DOMContentLoaded',()=>{
  let state={};
  const DB_KEY='itp_stamping_v1';
  let oeeChart=null;
  const main=document.getElementById('main-content');
  const osModal=document.getElementById('os-modal');

  const showToast=(msg,type='info')=>{const c=document.getElementById('toast-container');const t=document.createElement('div');t.className=`toast ${type}`;t.textContent=msg;c.appendChild(t);setTimeout(()=>t.classList.add('show'),10);setTimeout(()=>{t.classList.remove('show');t.addEventListener('transitionend',()=>t.remove())},4000);};
  const formatDateTime=(d)=>d?new Date(d).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'}):'N/A';
  const saveData=()=>{try{localStorage.setItem(DB_KEY,JSON.stringify(state))}catch(e){showToast('Erro ao salvar.','error')}};
  const loadData=()=>{const l=JSON.parse(localStorage.getItem(DB_KEY));state={dies:l?.dies||[],presses:l?.presses||[{id:1,name:"Prensa 100T"},{id:2,name:"Prensa 200T"}],parts:l?.parts||[],setups:l?.setups||[],productionOrders:l?.productionOrders||[],qualityChecks:l?.qualityChecks||[]};};

  window.openTab=(evt,tabId)=>{evt.preventDefault();document.querySelectorAll('.tab-content').forEach(t=>t.classList.add('hidden'));const el=document.getElementById(tabId);if(el)el.classList.remove('hidden');document.querySelectorAll('.menu a').forEach(l=>l.classList.remove('active'));if(evt.currentTarget)evt.currentTarget.classList.add('active');if(tabId==='dashboard')renderDashboard();};

  const calculateOEE=(order)=>{const{logs=[],idealCycleTime=0,downtime=0}=order;if(!logs.length||!idealCycleTime)return{oee:0,availability:0,performance:0,quality:0};const fL=logs[0];const lL=logs[logs.length-1];const pT=(new Date(lL.timestamp)-new Date(fL.timestamp))/(1000*60);if(pT<=0)return{oee:0,availability:0,performance:0,quality:0};const oT=pT-downtime;const a=(oT/pT);const tP=lL.totalCounter;const tS=logs.reduce((x,l)=>x+(l.scrap||0),0);const gP=tP-tS;const q=tP>0?(gP/tP):0;const iTP=(tP*idealCycleTime)/60;const p=oT>0?(iTP/oT):0;const oee=a*p*q;return{oee:oee*100,availability:a*100,performance:p*100,quality:q*100};};

  const renderDashboard=()=>{const co=state.productionOrders.filter(o=>o.status==='Finalizada');let tO=0,tA=0,tP=0,tQ=0,tProd=0,tScrap=0;co.forEach(op=>{const s=state.setups.find(x=>x.id===op.setupId);op.idealCycleTime=s?s.cycleTime:0;const d=calculateOEE(op);tO+=d.oee;tA+=d.availability;tP+=d.performance;tQ+=d.quality;tProd+=op.logs.length?op.logs[op.logs.length-1].totalCounter:0;tScrap+=op.logs.reduce((a,l)=>a+(l.scrap||0),0);});const n=co.length||1;const aO=co.length?tO/n:0,aA=co.length?tA/n:0,aP=co.length?tP/n:0,aQ=co.length?tQ/n:0;const sR=tProd>0?(tScrap/tProd)*100:0;document.getElementById('kpi-oee').textContent=`${aO.toFixed(1)}%`;document.getElementById('kpi-availability').textContent=`${aA.toFixed(1)}%`;document.getElementById('kpi-performance').textContent=`${aP.toFixed(1)}%`;document.getElementById('kpi-quality').textContent=`${aQ.toFixed(1)}%`;document.getElementById('kpi-produced').textContent=tProd;document.getElementById('kpi-scrap').textContent=`${sR.toFixed(1)}%`;document.getElementById('bar-a').style.width=`${aA}%`;document.getElementById('bar-a').textContent=`D: ${aA.toFixed(0)}%`;document.getElementById('bar-p').style.width=`${aP}%`;document.getElementById('bar-p').textContent=`P: ${aP.toFixed(0)}%`;document.getElementById('bar-q').style.width=`${aQ}%`;document.getElementById('bar-q').textContent=`Q: ${aQ.toFixed(0)}%`;const ctx=document.getElementById('oee-chart')?.getContext('2d');if(!ctx)return;if(oeeChart)oeeChart.destroy();const cd=co.slice(-10).map(op=>calculateOEE(op).oee);const cl=co.slice(-10).map(op=>op.opNumber);oeeChart=new Chart(ctx,{type:'bar',data:{labels:cl,datasets:[{label:'OEE por OP (%)',data:cd,backgroundColor:'rgba(255,122,26,.6)',borderColor:'#ff7a1a',borderWidth:1}]},options:{scales:{y:{beginAtZero:true,max:100,ticks:{color:'#cbd5e1'}},x:{ticks:{color:'#cbd5e1'}}},plugins:{legend:{labels:{color:'#cbd5e1'}}}}});};

  const renderSetupsList=()=>{const tb=document.getElementById('tbl-setups');if(!tb)return;tb.innerHTML='';state.setups.forEach(s=>{const tr=tb.insertRow();tr.innerHTML=`<td>${s.partNumber}</td><td>${s.dieCode}</td><td>${s.pressName}</td><td>${s.force} T</td><td>${s.speed} GPM</td>`;const a=tr.insertCell();a.innerHTML=`<button class="btn ghost btn-edit-setup" data-id="${s.id}">Editar</button> <button class="btn ghost btn-delete-setup" data-id="${s.id}" style="color:var(--bad)">Excluir</button>`;});};
  const renderProductionOrders=()=>{const tb=document.getElementById('tbl-production');if(!tb)return;tb.innerHTML='';state.productionOrders.filter(o=>o.status==='Ativa').forEach(op=>{const tr=tb.insertRow();const s=state.setups.find(x=>x.id==op.setupId)||{};const lL=op.logs.length?op.logs[op.logs.length-1]:{totalCounter:0};const pg=op.plannedQty>0?(lL.totalCounter/op.plannedQty)*100:0;tr.innerHTML=`<td>${op.opNumber}</td><td>${s.partNumber||'N/A'}</td><td>${lL.totalCounter} / ${op.plannedQty}</td><td><progress value="${pg}" max="100"></progress> ${pg.toFixed(0)}%</td><td>${formatDateTime(op.startTime)}</td>`;const a=tr.insertCell();a.innerHTML=`<button class="btn ghost btn-log-production" data-id="${op.id}">Apontar</button> <button class="btn primary btn-finish-op" data-id="${op.id}">Finalizar</button>`;});};
  const renderQualityChecks=()=>{const tb=document.getElementById('tbl-quality');if(!tb)return;tb.innerHTML='';state.qualityChecks.slice(-20).reverse().forEach(qc=>{const tr=tb.insertRow();tr.innerHTML=`<td>${qc.opNumber}</td><td>${qc.dimension}</td><td>${qc.result}</td><td>${qc.inspector}</td><td>${formatDateTime(qc.timestamp)}</td>`;const a=tr.insertCell();a.innerHTML=`<button class="btn ghost btn-delete-qc" data-id="${qc.id}" style="color:var(--bad)">Excluir</button>`;});};
  const renderHistory=()=>{const tb=document.getElementById('tbl-history');if(!tb)return;tb.innerHTML='';state.productionOrders.filter(o=>o.status==='Finalizada').forEach(op=>{const s=state.setups.find(x=>x.id===op.setupId)||{};op.idealCycleTime=s?s.cycleTime:0;const oee=calculateOEE(op).oee;const tP=op.logs.length?op.logs[op.logs.length-1].totalCounter:0;const tS=op.logs.reduce((a,l)=>a+(l.scrap||0),0);const tr=tb.insertRow();tr.innerHTML=`<td>${op.opNumber}</td><td>${s.partNumber||'N/A'}</td><td>${tP}</td><td>${tS}</td><td>${oee.toFixed(1)}%</td><td>${formatDateTime(op.endTime)}</td>`;const a=tr.insertCell();a.innerHTML=`<button class="btn ghost btn-view-op" data-id="${op.id}">Detalhes</button>`;});};
  const renderCadastros=()=>{const rL=(k,tId)=>{const tb=document.querySelector(`#${tId} tbody`);if(!tb)return;tb.innerHTML='';state[k].forEach(it=>{const tr=tb.insertRow();tr.insertCell().textContent=it.name;tr.insertCell().innerHTML=`<button class="btn ghost" onclick="deleteCadItem('${k}',${it.id})">Excluir</button>`;});};rL('dies','tbl-dies');rL('presses','tbl-presses');rL('parts','tbl-parts');};
  window.deleteCadItem=(k,id)=>{if(confirm('Excluir?')){state[k]=state[k].filter(i=>i.id!==id);saveData();renderAll();showToast('Excluído.','success');}};
  const updateRecordCounters=()=>{document.getElementById('op-count').textContent=state.productionOrders.filter(o=>o.status==='Ativa').length;document.getElementById('setup-count').textContent=state.setups.length;};
  const fillAllSelects=()=>{const sP=document.getElementById('setup_partNumber'),sD=document.getElementById('setup_dieCode'),sPr=document.getElementById('setup_pressName'),qO=document.getElementById('qc_opNumber');if(sP)sP.innerHTML='<option value="">Selecione...</option>'+state.parts.map(p=>`<option value="${p.name}">${p.name}</option>`).join('');if(sD)sD.innerHTML='<option value="">Selecione...</option>'+state.dies.map(d=>`<option value="${d.name}">${d.name}</option>`).join('');if(sPr)sPr.innerHTML='<option value="">Selecione...</option>'+state.presses.map(p=>`<option value="${p.name}">${p.name}</option>`).join('');if(qO)qO.innerHTML='<option value="">Selecione...</option>'+state.productionOrders.filter(o=>o.status==='Ativa').map(o=>`<option value="${o.opNumber}">${o.opNumber}</option>`).join('');};
  const renderAll=()=>{renderSetupsList();renderProductionOrders();renderQualityChecks();renderHistory();renderCadastros();updateRecordCounters();fillAllSelects();};

  const createViewsHTML=()=>`
    <div id="dashboard" class="tab-content">
      <section><h2>Dashboard de OEE</h2>
        <div class="kpi-grid">
          <div class="kpi-card"><h3>OEE Geral</h3><b class="kpi-value" id="kpi-oee">0%</b></div>
          <div class="kpi-card"><h3>Disponibilidade</h3><b class="kpi-value" id="kpi-availability">0%</b></div>
          <div class="kpi-card"><h3>Performance</h3><b class="kpi-value" id="kpi-performance">0%</b></div>
          <div class="kpi-card"><h3>Qualidade</h3><b class="kpi-value" id="kpi-quality">0%</b></div>
          <div class="kpi-card"><h3>Produzido</h3><b class="kpi-value" id="kpi-produced">0</b></div>
          <div class="kpi-card"><h3>Refugo (%)</h3><b class="kpi-value" id="kpi-scrap">0%</b></div>
        </div>
        <div class="oee-bar">
          <div id="bar-a" style="background:#ff7a1a;"></div>
          <div id="bar-p" style="background:#ffa552;"></div>
          <div id="bar-q" style="background:var(--ok);"></div>
        </div>
      </section>
      <section><h4>OEE das Últimas Ordens</h4><canvas id="oee-chart" height="80"></canvas></section>
    </div>
    <div id="setups" class="tab-content hidden">
      <section><h2>Ficha de Parâmetros</h2>
        <form id="form-setup"><input type="hidden" id="setup_id">
          <div class="grid" style="grid-template-columns:repeat(4,1fr);">
            <div class="field"><label>Peça</label><select id="setup_partNumber" required></select></div>
            <div class="field"><label>Ferramenta</label><select id="setup_dieCode" required></select></div>
            <div class="field"><label>Prensa</label><select id="setup_pressName" required></select></div>
            <div class="field"><label>Ciclo Ideal (s/pç)</label><input id="setup_cycleTime" type="number" step="0.1" required></div>
            <div class="field"><label>Força (ton)</label><input id="setup_force" type="number"></div>
            <div class="field"><label>Velocidade (GPM)</label><input id="setup_speed" type="number"></div>
            <div class="field"><label>Material</label><input id="setup_material"></div>
            <div class="field"><label>Lubrificante</label><input id="setup_lubricant"></div>
          </div>
          <div style="margin-top:16px;display:flex;gap:10px;">
            <button type="submit" class="btn primary">Salvar Ficha</button>
            <button type="button" class="btn ghost" id="btn-clear-setup">Limpar</button>
          </div>
        </form>
      </section>
      <section><h4>Fichas Salvas</h4><div style="max-height:400px;overflow:auto"><table><thead><tr><th>Peça</th><th>Ferramenta</th><th>Prensa</th><th>Força</th><th>Veloc.</th><th>Ações</th></tr></thead><tbody id="tbl-setups"></tbody></table></div></section>
    </div>
    <div id="production" class="tab-content hidden">
      <section><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;"><h2>Ordens Ativas</h2><button id="btn-new-op" class="btn primary">+ Nova OP</button></div>
        <div style="max-height:600px;overflow:auto"><table><thead><tr><th>OP</th><th>Peça</th><th>Progresso</th><th>%</th><th>Início</th><th>Ações</th></tr></thead><tbody id="tbl-production"></tbody></table></div>
      </section>
    </div>
    <div id="quality" class="tab-content hidden">
      <section><h2>Controle de Qualidade</h2>
        <form id="form-quality"><input type="hidden" id="qc_id">
          <div class="grid" style="grid-template-columns:repeat(4,1fr);">
            <div class="field"><label>OP</label><select id="qc_opNumber" required></select></div>
            <div class="field"><label>Dimensão (mm)</label><input id="qc_dimension" type="number" step="0.01"></div>
            <div class="field"><label>Resultado</label><select id="qc_result"><option>Aprovado</option><option>Reprovado</option></select></div>
            <div class="field"><label>Inspetor</label><input id="qc_inspector" required></div>
          </div>
          <div style="margin-top:16px;"><button type="submit" class="btn primary">Salvar Medição</button></div>
        </form>
      </section>
      <section><h4>Últimos Registros</h4><div style="max-height:400px;overflow:auto"><table><thead><tr><th>OP</th><th>Medida</th><th>Resultado</th><th>Inspetor</th><th>Data/Hora</th><th>Ação</th></tr></thead><tbody id="tbl-quality"></tbody></table></div></section>
    </div>
    <div id="history" class="tab-content hidden">
      <section><h2>Histórico de OPs</h2><div style="max-height:600px;overflow:auto"><table><thead><tr><th>OP</th><th>Peça</th><th>Produzido</th><th>Refugo</th><th>OEE</th><th>Fim</th><th>Ações</th></tr></thead><tbody id="tbl-history"></tbody></table></div></section>
    </div>
    <div id="cadastros" class="tab-content hidden">
      <section><h4>Ferramentas (Estampos)</h4><div style="display:flex;gap:10px;margin-bottom:12px;"><input class="new-item-input" data-key="dies" placeholder="Código da ferramenta" style="flex-grow:1;"><button class="btn ghost btn-add-item" data-key="dies">Adicionar</button></div><div style="max-height:200px;overflow:auto"><table id="tbl-dies"><thead><tr><th>Código</th><th>Ação</th></tr></thead><tbody></tbody></table></div></section>
      <section><h4>Prensas</h4><div style="display:flex;gap:10px;margin-bottom:12px;"><input class="new-item-input" data-key="presses" placeholder="Nome da prensa" style="flex-grow:1;"><button class="btn ghost btn-add-item" data-key="presses">Adicionar</button></div><div style="max-height:200px;overflow:auto"><table id="tbl-presses"><thead><tr><th>Nome</th><th>Ação</th></tr></thead><tbody></tbody></table></div></section>
      <section><h4>Peças</h4><div style="display:flex;gap:10px;margin-bottom:12px;"><input class="new-item-input" data-key="parts" placeholder="Código da peça" style="flex-grow:1;"><button class="btn ghost btn-add-item" data-key="parts">Adicionar</button></div><div style="max-height:200px;overflow:auto"><table id="tbl-parts"><thead><tr><th>Código</th><th>Ação</th></tr></thead><tbody></tbody></table></div></section>
    </div>
    <div id="help" class="tab-content hidden">
      <section><h2>Guia Rápido</h2>
        <h4>1. O que é OEE?</h4>
        <p><b>OEE = Disponibilidade × Performance × Qualidade</b></p>
        <h4>2. Fluxo</h4>
        <ol><li>Cadastros: alimente Ferramentas, Prensas e Peças</li><li>Ficha de Parâmetros: defina o ciclo ideal</li><li>Controle de Produção: inicie OP e aponte produção</li><li>Finalize a OP para alimentar o Dashboard</li></ol>
      </section>
    </div>`;

  const openProductionOrderModal=(opId=null)=>{const op=opId?state.productionOrders.find(o=>o.id===opId):null;const sO=state.setups.map(s=>`<option value="${s.id}" ${op?.setupId==s.id?'selected':''}>${s.partNumber} / ${s.pressName}</option>`).join('');osModal.innerHTML=`<div class="modal-content"><div style="display:flex;justify-content:space-between;align-items:center;"><h3>${op?'Detalhes da OP':'Nova Ordem'}</h3><button class="btn ghost" id="btn-close-modal">&times;</button></div><form id="form-op"><input type="hidden" id="op_id" value="${op?.id||''}"><div class="grid"><div class="field"><label>Nº da OP</label><input id="op_opNumber" value="${op?.opNumber||`OP-${Date.now()}`}" required></div><div class="field"><label>Ficha</label><select id="op_setupId" required><option value="">Selecione...</option>${sO}</select></div><div class="field"><label>Qtde Planejada</label><input id="op_plannedQty" type="number" value="${op?.plannedQty||''}" required></div><div class="field"><label>Início</label><input id="op_startTime" type="datetime-local" value="${op?.startTime?op.startTime.slice(0,16):new Date().toISOString().slice(0,16)}" required></div></div><div style="margin-top:20px;"><button type="submit" class="btn primary">${op?'Salvar':'Iniciar Produção'}</button></div></form></div>`;osModal.classList.add('active');};
  const openLogProductionModal=(opId)=>{const op=state.productionOrders.find(o=>o.id===opId);if(!op)return showToast('OP não encontrada','error');const lLC=op.logs.length?op.logs[op.logs.length-1].totalCounter:0;osModal.innerHTML=`<div class="modal-content" style="max-width:500px;"><div style="display:flex;justify-content:space-between;align-items:center;"><h3>Apontamento - OP ${op.opNumber}</h3><button class="btn ghost" id="btn-close-modal">&times;</button></div><form id="form-log"><input type="hidden" id="log_opId" value="${op.id}"><div class="grid"><div class="field"><label>Contador Total</label><input id="log_totalCounter" type="number" value="${lLC}" required></div><div class="field"><label>Refugo (período)</label><input id="log_scrap" type="number" value="0" required></div><div class="field"><label>Parada (min)</label><input id="log_downtime" type="number" value="0" required></div></div><div class="field" style="margin-top:10px;"><label>Observação</label><input id="log_notes"></div><div style="margin-top:20px;"><button type="submit" class="btn primary">Registrar</button></div></form></div>`;osModal.classList.add('active');};

  const addEventListeners=()=>{
    document.getElementById('form-setup')?.addEventListener('submit',e=>{e.preventDefault();const id=document.getElementById('setup_id').value;const r={id:id?parseInt(id):Date.now(),partNumber:document.getElementById('setup_partNumber').value,dieCode:document.getElementById('setup_dieCode').value,pressName:document.getElementById('setup_pressName').value,cycleTime:parseFloat(document.getElementById('setup_cycleTime').value),force:document.getElementById('setup_force').value,speed:document.getElementById('setup_speed').value,material:document.getElementById('setup_material').value,lubricant:document.getElementById('setup_lubricant').value};if(id)state.setups=state.setups.map(s=>s.id==id?r:s);else state.setups.push(r);saveData();renderAll();showToast('Ficha salva!','success');e.target.reset();document.getElementById('setup_id').value='';});
    document.getElementById('btn-clear-setup')?.addEventListener('click',()=>document.getElementById('form-setup').reset());
    document.getElementById('tbl-setups')?.addEventListener('click',e=>{const id=e.target.dataset.id;if(e.target.classList.contains('btn-edit-setup')){const s=state.setups.find(x=>x.id==id);if(s){Object.keys(s).forEach(k=>{const i=document.getElementById(`setup_${k}`);if(i)i.value=s[k];});window.scrollTo(0,0);}}if(e.target.classList.contains('btn-delete-setup')){if(confirm('Excluir?')){state.setups=state.setups.filter(x=>x.id!=id);saveData();renderAll();}}});
    document.getElementById('btn-new-op')?.addEventListener('click',()=>openProductionOrderModal());
    document.getElementById('tbl-production')?.addEventListener('click',e=>{const id=parseInt(e.target.dataset.id);if(e.target.classList.contains('btn-log-production'))openLogProductionModal(id);if(e.target.classList.contains('btn-finish-op')){if(confirm('Finalizar OP?')){const op=state.productionOrders.find(o=>o.id===id);if(op){op.status='Finalizada';op.endTime=new Date().toISOString();saveData();renderAll();showToast('OP Finalizada!','success');}}}});
    document.getElementById('form-quality')?.addEventListener('submit',e=>{e.preventDefault();const r={id:Date.now(),opNumber:document.getElementById('qc_opNumber').value,dimension:document.getElementById('qc_dimension').value,result:document.getElementById('qc_result').value,inspector:document.getElementById('qc_inspector').value,timestamp:new Date().toISOString()};state.qualityChecks.push(r);saveData();renderAll();showToast('Medição salva!','success');e.target.reset();});
    document.getElementById('tbl-quality')?.addEventListener('click',e=>{if(e.target.classList.contains('btn-delete-qc')){const id=parseInt(e.target.dataset.id);if(confirm('Excluir?')){state.qualityChecks=state.qualityChecks.filter(q=>q.id!=id);saveData();renderQualityChecks();}}});
    osModal.addEventListener('click',e=>{if(e.target.id==='btn-close-modal')osModal.classList.remove('active');});
    osModal.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='form-op'){const opId=document.getElementById('op_id').value;const sId=parseInt(document.getElementById('op_setupId').value);if(!sId)return showToast('Selecione uma Ficha!','error');const r={opNumber:document.getElementById('op_opNumber').value,setupId:sId,plannedQty:parseInt(document.getElementById('op_plannedQty').value),startTime:document.getElementById('op_startTime').value};if(opId){const op=state.productionOrders.find(o=>o.id==opId);if(op)Object.assign(op,r);showToast('OP atualizada!','success');}else{Object.assign(r,{id:Date.now(),status:'Ativa',logs:[],downtime:0});state.productionOrders.push(r);showToast('OP iniciada!','success');}saveData();renderAll();osModal.classList.remove('active');}if(e.target.id==='form-log'){const opId=parseInt(document.getElementById('log_opId').value);const op=state.productionOrders.find(o=>o.id==opId);const dt=parseInt(document.getElementById('log_downtime').value);if(op){op.logs.push({timestamp:new Date().toISOString(),totalCounter:parseInt(document.getElementById('log_totalCounter').value),scrap:parseInt(document.getElementById('log_scrap').value),notes:document.getElementById('log_notes').value});op.downtime+=dt;saveData();renderAll();showToast('Apontamento OK!','success');osModal.classList.remove('active');}}});
    document.querySelectorAll('.btn-add-item').forEach(b=>{b.addEventListener('click',e=>{const k=e.target.dataset.key;const i=document.querySelector(`.new-item-input[data-key="${k}"]`);if(i.value.trim()){state[k].push({id:Date.now(),name:i.value.trim()});saveData();renderAll();i.value='';i.focus();}});});
  };

  const initApp=()=>{loadData();main.innerHTML=createViewsHTML();addEventListeners();renderAll();openTab({currentTarget:document.querySelector('.menu a')},'dashboard');};
  document.getElementById('btn-download-backup').addEventListener('click',()=>{const b=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const l=document.createElement("a");l.href=URL.createObjectURL(b);l.download=`itp_estamparia_${new Date().toISOString().slice(0,10)}.json`;l.click();URL.revokeObjectURL(l.href);showToast("Backup baixado!","success");});
  document.getElementById('btn-restore-backup').addEventListener('click',()=>{const i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=e=>{const r=new FileReader();r.onload=ev=>{if(!confirm('Substituir dados atuais?'))return;try{state=JSON.parse(ev.target.result);saveData();showToast('Restaurado!','success');setTimeout(()=>location.reload(),1000);}catch(err){showToast('Arquivo inválido.','error');}};r.readAsText(e.target.files[0]);};i.click();});
  document.getElementById('btn-archive-and-clear').addEventListener('click',()=>{if(confirm("Baixar backup e APAGAR dados?")){document.getElementById('btn-download-backup').click();localStorage.removeItem(DB_KEY);showToast("Dados limpos.","info");setTimeout(()=>location.reload(),1500);}});
  document.getElementById('btn-export-pdf').addEventListener('click',()=>window.print());
  initApp();
});
</script>
</body>
</html>
